name: Build unsigned tvOS IPA

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "tvOS deployment target"
        required: false
        default: "15.6"
      release_tag:
        description: "Release tag to publish (leave blank to use build-<run number>)"
        required: false
        default: ""
      publish_release:
        description: "Publish a Release. Leave false to verify the build only - the .ipa is still kept as a workflow artifact."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i appletv

      - name: Build Orbrisa.app (unsigned, device arm64)
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.deployment_target || '15.6' }}"
          echo "Building with TVOS_DEPLOYMENT_TARGET=$TARGET"
          xcodebuild \
            -project Orbrisa.xcodeproj \
            -scheme Orbrisa \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            TVOS_DEPLOYMENT_TARGET="$TARGET" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build 2>&1 | tee build.log | grep -E "error:|warning: .*(only available|is unavailable|introduced in)" || true
          test "${PIPESTATUS[0]}" -eq 0
          echo "--- APIs newer than the deployment target (each must be guarded) ---"
          grep -E "only available on tvOS|is only available" build.log | sort -u | head -50 || true

      - name: Package into an unsigned .ipa
        id: package
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-appletvos/Orbrisa.app
          test -d "$APP"

          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          find "$APP" -name embedded.mobileprovision -delete

          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          lipo -info "$BIN"
          echo "--- minimum OS recorded in each bundle ---"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" || true
          for plist in "$APP"/PlugIns/*/Info.plist "$APP"/Frameworks/*/Info.plist; do
            [ -f "$plist" ] || continue
            echo "$(dirname "$plist" | xargs basename): $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist" 2>/dev/null || echo '-')"
          done
          echo "--- minos in each Mach-O (must be <= 16.6) ---"
          TOO_NEW=0
          while read -r f; do
            if file "$f" | grep -q Mach-O; then
              MINOS=$(vtool -show-build "$f" 2>/dev/null | awk '/minos/{print $2}' | sort -uV | tail -1)
              echo "$(basename "$f"): ${MINOS:-?}"
              if [ -n "$MINOS" ] && [ "$(printf '%s\n16.6\n' "$MINOS" | sort -V | tail -1)" != "16.6" ]; then
                echo "::error::$f needs tvOS $MINOS, newer than 16.6"
                TOO_NEW=1
              fi
            fi
          done < <(find "$APP" -type f \( -perm -u+x -o -name '*.dylib' \))
          [ "$TOO_NEW" -eq 0 ]

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          IPA="Orbrisa-${VERSION}-tvOS15.6-unsigned.ipa"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$IPA" Payload
          rm -rf Payload
          ls -lh "$IPA"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$IPA" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the IPA as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbrisa-unsigned-ipa
          path: ${{ steps.package.outputs.ipa }}
          if-no-files-found: error

      - name: Publish a release with the IPA
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          IPA: ${{ steps.package.outputs.ipa }}
          VERSION: ${{ steps.package.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="build-${GITHUB_RUN_NUMBER}"
          cat > notes.md <<NOTES
          Orbrisa (fdm96/Orbrisa) built for tvOS 15.6+ (tested target: Apple TV on tvOS 16.6, installed with TrollStore).

          | | |
          |---|---|
          | App version | $VERSION |
          | Xcode | $(xcodebuild -version | head -1) |
          | tvOS deployment target | ${{ github.event.inputs.deployment_target || '15.6' }} |
          | SHA-256 | \`$SHA256\` |
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" --title "Orbrisa $VERSION for tvOS 16 ($TAG)" --notes-file notes.md
          fi
